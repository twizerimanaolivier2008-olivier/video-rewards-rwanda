name: Build and deploy Video Rewards Rwanda

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Verify build output
        run: test -s frontend/dist/index.html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Validate required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$API_ORIGIN"
      - name: Configure API origin secret
        run: printf '%s' "$API_ORIGIN" | wrangler secret put API_ORIGIN --config wrangler.jsonc
        env:
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure optional Cloudflare Access service token
        if: ${{ secrets.API_ACCESS_CLIENT_ID != '' && secrets.API_ACCESS_CLIENT_SECRET != '' }}
        run: |
          printf '%s' "$API_ACCESS_CLIENT_ID" | wrangler secret put API_ACCESS_CLIENT_ID --config wrangler.jsonc
          printf '%s' "$API_ACCESS_CLIENT_SECRET" | wrangler secret put API_ACCESS_CLIENT_SECRET --config wrangler.jsonc
        env:
          API_ACCESS_CLIENT_ID: ${{ secrets.API_ACCESS_CLIENT_ID }}
          API_ACCESS_CLIENT_SECRET: ${{ secrets.API_ACCESS_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Workers
        run: wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
